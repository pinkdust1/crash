services:
  - type: web
    name: crash
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1   # ONE worker: engine lives in-process
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: GAME_UNDERBOARD_TOKEN
        sync: false
      - key: PHP_API_URL            # https://admin.zero7.casino/core.php
        sync: false
      - key: PUBLIC_WS_URL          # wss://<service>.onrender.com/ws/crash
        sync: false